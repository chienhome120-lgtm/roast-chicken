<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>啊啊烤雞飛行</title><style>*{box-sizing:border-box}body{margin:0;background:#101b29;color:white;font-family:system-ui,'Noto Sans TC',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 5px #333;font-size:21px}#meter{position:absolute;left:14px;bottom:20px;width:205px;background:#162a40b9;border:1px solid #ffffff55;border-radius:18px;padding:9px;font-size:12px}#bar{height:10px;background:#ffffff44;border-radius:10px;margin-top:6px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#6deab8,#f9d34e,#f25d45)}#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,390px);background:#102237e8;border:1px solid #ffffff55;border-radius:22px;padding:23px;text-align:center;pointer-events:auto;box-shadow:0 16px 55px #0009;backdrop-filter:blur(12px)}h1{margin:0 0 10px;font-size:29px}p{line-height:1.65;color:#dce8f4}button{border:0;border-radius:12px;background:linear-gradient(135deg,#ffb348,#ed703c);color:#241508;font-weight:900;font-size:18px;padding:13px 20px;margin:5px;cursor:pointer}#status{font-size:13px;color:#bcefff}#hint{position:absolute;bottom:25px;right:12px;font-size:12px;color:#fff9;text-align:right}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="top"><span>🍗 啊啊烤雞飛行</span><span id="score">0　🏆 0</span></div><div id="meter">🎤 聲音強度 <span id="vol">0%</span><div id="bar"><div id="fill"></div></div></div><div id="hint">「啊」上升・「嗚」下降並減速<br>觸控：按左上升、按右下降</div><div id="panel"><h1>🍗 烤雞飛行挑戰</h1><p>用你的聲音控制一隻金黃酥脆、沒有羽毛的烤雞！<br><b>大聲「啊」＝往上飛</b><br><b>「嗚」＝往下飛＋減慢前進</b><br>安靜＝自然下降<br>穿越水管縫隙得分，碰撞即結束。</p><button id="start">🎤 開啟麥克風開始</button><button id="demo">👆 觸控模式</button><p id="status">需允許麥克風權限；建議使用 HTTPS 網址開啟。</p></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,ground,scale;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);ground=H-65;scale=Math.max(.7,Math.min(1.3,W/420))}addEventListener('resize',resize);resize();let voiceKind='quiet',voiceConfidence=0,downHold=0;let state='menu',mode='touch',audio,analyser,arr,freq,stream,level=0,smoothed=0,press=false,touchDown=false,score=0,best=+(localStorage.roastBest||0),bird,pipes=[],time=0,last=0,spawn=0,flash=0;const $=id=>document.getElementById(id);function reset(){bird={x:W*.28,y:H*.43,vy:0,r:21*scale,rot:0};pipes=[];score=0;spawn=0;time=0;flash=0;state='play';$('panel').style.display='none'}function end(){state='over';flash=1;if(score>best){best=score;localStorage.roastBest=best}$('panel').style.display='block';$('panel').querySelector('h1').textContent='🍗 烤雞撞管啦！';$('panel').querySelector('p').innerHTML=`本次得分：<b>${score}</b><br>最高紀錄：<b>${best}</b><br>再喊一次「啊」挑戰新紀錄！`;$('start').textContent='🎤 再玩一次';$('demo').textContent='👆 觸控再玩'}async function startMic(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('瀏覽器未提供麥克風 API，請使用 HTTPS 或 localhost');if(!stream){stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});audio=new (window.AudioContext||window.webkitAudioContext)();analyser=audio.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=.65;audio.createMediaStreamSource(stream).connect(analyser);arr=new Uint8Array(analyser.fftSize);freq=new Uint8Array(analyser.frequencyBinCount)}await audio.resume();mode='mic';reset()}catch(e){$('status').textContent='無法啟用麥克風：'+e.message+'。可先使用觸控模式。'}}$('start').onclick=startMic;$('demo').onclick=()=>{mode='touch';reset()};c.addEventListener('pointerdown',e=>{touchDown=e.clientX>W*.5;press=true});addEventListener('pointerup',()=>{press=false;touchDown=false});addEventListener('keydown',e=>{if(e.code==='Space'){press=true;e.preventDefault()}});addEventListener('keyup',e=>{if(e.code==='Space')press=false});function volume(){if(mode==='touch')return press?0.9:0;if(!analyser)return 0;analyser.getByteTimeDomainData(arr);let sum=0;for(let v of arr){let a=(v-128)/128;sum+=a*a}let rms=Math.sqrt(sum/arr.length);return Math.min(1,Math.max(0,(rms-.018)*7.5))}function detectVowel(v){
  if(mode==='touch')return press?(touchDown?'wu':'ah'):'quiet';
  if(!analyser||v<.12)return 'quiet';
  // Approximate Mandarin vowel recognition from spectral energy. This is heuristic,
  // not speech-to-text; background noise and microphones affect accuracy.
  analyser.getByteFrequencyData(freq);
  const hz=audio.sampleRate/analyser.fftSize;
  function energy(lo,hi){let sum=0;for(let i=Math.max(1,Math.floor(lo/hz));i<Math.min(freq.length,Math.ceil(hi/hz));i++){let a=freq[i]/255;sum+=a*a}return sum/Math.max(1,(hi-lo)/hz)}
  const low=energy(180,650),mid=energy(750,1600),high=energy(1600,3200);
  // /u/ typically has a low F1 and low F2; /a/ has much stronger mid bands.
  const ratio=(mid+high*.55)/(low+.0001);
  if(ratio<.50 && low>.012)return 'wu';
  if(ratio>.72)return 'ah';
  return voiceKind==='wu'?'wu':'ah';
}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}function bg(t){let sky=x.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#4aabc8');sky.addColorStop(.56,'#8cdeea');sky.addColorStop(1,'#e8f1bf');x.fillStyle=sky;x.fillRect(0,0,W,H);let sun=x.createRadialGradient(W*.76,H*.19,2,W*.76,H*.19,W*.46);sun.addColorStop(0,'#fff9db88');sun.addColorStop(1,'#fff9db00');x.fillStyle=sun;x.fillRect(0,0,W,H);for(let layer=0;layer<3;layer++){let shift=(t*(7+layer*8))%100;for(let i=-2;i<W/90+3;i++){let a=i*95-shift;let ht=55+Math.sin(i*2.4+layer)*22;x.fillStyle=['#91c9c7','#65b9af','#3e9e87'][layer];x.globalAlpha=.42+layer*.13;x.fillRect(a,ground-ht,32,ht);x.fillRect(a+34,ground-ht*.7,22,ht*.7);x.fillStyle='#e9f9c9';for(let j=0;j<4;j++)for(let k=0;k<2;k++)x.fillRect(a+5+k*11,ground-ht+9+j*12,4,6)}x.globalAlpha=1}for(let i=0;i<W/50+3;i++){let a=i*55-(t*25)%55;x.fillStyle='#55b875';x.beginPath();x.arc(a,ground-10,31,Math.PI,0);x.fill();x.fillStyle='#7ed68a';x.beginPath();x.arc(a+15,ground-5,21,Math.PI,0);x.fill()}x.fillStyle='#7b9851';x.fillRect(0,ground,W,6);x.fillStyle='#d5b47a';x.fillRect(0,ground+6,W,H-ground);x.fillStyle='#9d7847';for(let i=0;i<W/35+1;i++){x.fillRect(i*35-(t*80)%35,ground+18,19,4)}}function pipe(p){let w=p.w,top=p.gap-p.open/2,bot=p.gap+p.open/2;for(let part of [[0,top-14],[bot,ground-bot]]){let y=p===null?0:part[0],h=part[1];if(h<=0)continue;let g=x.createLinearGradient(p.x,0,p.x+w,0);g.addColorStop(0,'#285b35');g.addColorStop(.12,'#61a34d');g.addColorStop(.32,'#d5ed82');g.addColorStop(.57,'#84c456');g.addColorStop(.85,'#3c853d');g.addColorStop(1,'#214c30');x.fillStyle=g;x.fillRect(p.x,y,w,h);x.strokeStyle='#25492e';x.lineWidth=3;x.strokeRect(p.x,y,w,h);let lipY=y===0?top-24:bot;x.fillStyle=g;rr(p.x-6,lipY,w+12,24,3);x.strokeRect(p.x-6,lipY,w+12,24);x.fillStyle='#ffffff28';x.fillRect(p.x+15,y+4,5,Math.max(0,h-8))}}function chicken(){x.save();x.translate(bird.x,bird.y);x.rotate(bird.rot);let r=bird.r;x.shadowColor='#51261077';x.shadowBlur=10;x.shadowOffsetY=6;let g=x.createRadialGradient(-r*.3,-r*.5,2,0,0,r*1.4);g.addColorStop(0,'#ffe6a1');g.addColorStop(.35,'#eaa24b');g.addColorStop(.7,'#bd6427');g.addColorStop(1,'#753519');x.fillStyle=g;x.beginPath();x.ellipse(0,0,r*1.2,r*.84,-.15,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#9c461c';x.beginPath();x.ellipse(-r*.1,r*.38,r*.48,r*.25,.25,0,7);x.fill();x.fillStyle='#e7a04d';x.beginPath();x.ellipse(r*.25,r*.27,r*.5,r*.25,-.4,0,7);x.fill();x.fillStyle='#ffe0a2';x.beginPath();x.ellipse(-r*.33,-r*.45,r*.55,r*.17,-.35,0,7);x.fill();for(let yy of [-.38,.34]){x.save();x.translate(-r*.98,r*yy);x.rotate(yy);x.fillStyle='#9c4e28';rr(-r*.32,-r*.16,r*.48,r*.32,8);x.fillStyle='#fff0d6';x.beginPath();x.arc(-r*.39,0,r*.15,0,7);x.arc(-r*.54,-r*.09,r*.13,0,7);x.fill();x.restore()}x.fillStyle='white';x.beginPath();x.arc(r*.66,-r*.28,r*.18,0,7);x.fill();x.fillStyle='#27211b';x.beginPath();x.arc(r*.72,-r*.27,r*.085,0,7);x.fill();x.restore()}function update(dt){time+=dt;let raw=volume();smoothed+=(raw-smoothed)*Math.min(1,dt*11);$('vol').textContent=Math.round(smoothed*100)+'%　'+(voiceKind==='wu'?'嗚 ↓ 慢速':voiceKind==='ah'?'啊 ↑':'安靜');$('fill').style.width=Math.round(smoothed*100)+'%';if(state!=='play')return;
let detected=detectVowel(smoothed);
// Smooth the classification to reduce flickering on syllable transitions.
if(detected==='wu')downHold=Math.min(.22,downHold+dt*2.6);
else downHold=Math.max(0,downHold-dt*4);
voiceKind=downHold>.09?'wu':detected==='quiet'?'quiet':'ah';
const diving=voiceKind==='wu' && smoothed>.12;
let speed=Math.min(240,145+score*3)*scale*(diving?.48:1);
let force=voiceKind==='ah'?Math.max(0,(smoothed-.075)/.925):0;
bird.vy+=(640-force*1550+(diving?620:0))*scale*dt;
bird.vy=Math.max(-340*scale,Math.min((diving?540:430)*scale,bird.vy));bird.y+=bird.vy*dt;bird.rot=Math.max(-.55,Math.min(1.1,bird.vy/430));spawn+=dt;if(spawn>1.65){spawn=0;let open=Math.max(152*scale,Math.min(205*scale,H*.28)-score*1.3);let margin=80*scale;pipes.push({x:W+30,w:68*scale,gap:margin+open/2+Math.random()*Math.max(1,ground-2*margin-open),open,passed:false})}for(let p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++}let pad=bird.r*.65;if(bird.x+pad>p.x-6&&bird.x-pad<p.x+p.w+6&&(bird.y-pad<p.gap-p.open/2||bird.y+pad>p.gap+p.open/2))end()}pipes=pipes.filter(p=>p.x+p.w>-20);if(bird.y+bird.r*.7>ground||bird.y-bird.r<0)end();$('score').textContent=`${score}　🏆 ${best}`}function draw(){bg(time);for(let p of pipes)pipe(p);if(bird)chicken();if(flash>0){x.fillStyle=`rgba(255,90,60,${flash*.22})`;x.fillRect(0,0,W,H);flash*=.86}}function loop(ts){let dt=Math.min(.035,(ts-last)/1000||.016);last=ts;update(dt);draw();requestAnimationFrame(loop)}bird={x:W*.28,y:H*.43,vy:0,r:21*scale,rot:0};requestAnimationFrame(loop);
</script></body></html>
