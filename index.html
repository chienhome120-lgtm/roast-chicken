<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>啊嗚烤雞飛行 V4</title><style>*{box-sizing:border-box}body{margin:0;background:#101b29;color:white;font-family:system-ui,'Noto Sans TC',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 5px #333;font-size:21px}#meter{position:absolute;left:14px;bottom:20px;width:205px;background:#162a40b9;border:1px solid #ffffff55;border-radius:18px;padding:9px;font-size:12px}#bar{height:10px;background:#ffffff44;border-radius:10px;margin-top:6px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#6deab8,#f9d34e,#f25d45)}#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,390px);background:#102237e8;border:1px solid #ffffff55;border-radius:22px;padding:23px;text-align:center;pointer-events:auto;box-shadow:0 16px 55px #0009;backdrop-filter:blur(12px)}h1{margin:0 0 10px;font-size:29px}p{line-height:1.65;color:#dce8f4}button{border:0;border-radius:12px;background:linear-gradient(135deg,#ffb348,#ed703c);color:#241508;font-weight:900;font-size:18px;padding:13px 20px;margin:5px;cursor:pointer}#status{font-size:13px;color:#bcefff}#tuning{position:absolute;top:52px;left:12px;width:min(235px,60vw);background:#102237c9;border-radius:12px;padding:8px 10px;pointer-events:auto;font-size:12px}#tuning label{display:flex;justify-content:space-between;gap:6px;margin:4px 0}#tuning input{width:100%;accent-color:#ffbd65}#hint{position:absolute;bottom:25px;right:12px;font-size:12px;color:#fff9;text-align:right}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="top"><span>🍗 啊啊烤雞飛行</span><span id="score">0　🏆 0</span></div><div id="tuning"><label>上升速度 <output id="upVal">85</output></label><input id="up" type="range" min="35" max="170" value="85"><label>下降速度 <output id="downVal">100</output></label><input id="down" type="range" min="35" max="190" value="100"><label>安靜下沉 <output id="idleVal">22</output></label><input id="idle" type="range" min="0" max="100" value="22"><label>前進速度 <output id="forwardVal">90</output></label><input id="forward" type="range" min="55" max="150" value="90"></div><div id="meter">🎤 聲音強度 <span id="vol">0%</span><div id="bar"><div id="fill"></div></div><div id="voiceState">等待校正</div></div><div id="hint">「啊」上升・「嗚」下降減速<br>左上角可調整速度<br>觸控：按左上升、按右下降</div><div id="panel"><h1>🍗 烤雞飛行挑戰</h1><p>用你的聲音控制一隻金黃酥脆、沒有羽毛的烤雞！<br><b>大聲「啊」＝往上飛</b><br><b>「嗚」＝往下飛＋減慢前進</b><br>安靜＝輕微下降（可調整）<br>穿越水管縫隙得分，碰撞即結束。</p><button id="start">🎤 開啟麥克風開始</button><button id="calibrate">🎛️ 重新校正「啊／嗚」</button><button id="demo">👆 觸控模式</button><p id="status">首次啟用會引導你各發出「啊」、「嗚」約 2 秒；建議 HTTPS 開啟。</p></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,ground,scale;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);ground=H-65;scale=Math.max(.7,Math.min(1.3,W/420))}addEventListener('resize',resize);resize();let voiceKind='quiet',voiceConfidence=0,downHold=0,templates={},noiseFloor=.008,gate=.018,calibrating=false,voiceVote=0,controlPower=0;let state='menu',mode='touch',audio,analyser,arr,freq,stream,level=0,smoothed=0,press=false,touchDown=false,score=0,best=+(localStorage.roastBest||0),bird,pipes=[],time=0,last=0,spawn=0,flash=0;const $=id=>document.getElementById(id);for(const id of ["up","down","idle","forward"]){$(id).oninput=()=>$(id+"Val").textContent=$(id).value}function reset(){bird={x:W*.28,y:H*.43,vy:0,r:21*scale,rot:0};pipes=[];score=0;spawn=0;time=0;flash=0;state='play';$('panel').style.display='none'}function end(){state='over';flash=1;if(score>best){best=score;localStorage.roastBest=best}$('panel').style.display='block';$('panel').querySelector('h1').textContent='🍗 烤雞撞管啦！';$('panel').querySelector('p').innerHTML=`本次得分：<b>${score}</b><br>最高紀錄：<b>${best}</b><br>再喊一次「啊」挑戰新紀錄！`;$('start').textContent='🎤 再玩一次';$('demo').textContent='👆 觸控再玩'}async function setupMic(){if(!navigator.mediaDevices?.getUserMedia)throw Error('請透過 HTTPS 網址開啟遊戲');if(!stream){stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:false}});audio=new (window.AudioContext||window.webkitAudioContext)();analyser=audio.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=.38;audio.createMediaStreamSource(stream).connect(analyser);arr=new Uint8Array(analyser.fftSize);freq=new Uint8Array(analyser.frequencyBinCount)}await audio.resume();mode='mic'}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rmsNow(){analyser.getByteTimeDomainData(arr);let sum=0;for(const v of arr){let z=(v-128)/128;sum+=z*z}return Math.sqrt(sum/arr.length)}
function feature(){analyser.getByteFrequencyData(freq);const hz=audio.sampleRate/analyser.fftSize;const bands=[[160,450],[450,750],[750,1100],[1100,1600],[1600,2300],[2300,3200]];let vals=bands.map(([lo,hi])=>{let sum=0,n=0;for(let i=Math.max(1,Math.floor(lo/hz));i<Math.min(freq.length,Math.ceil(hi/hz));i++){let a=freq[i]/255;sum+=a*a;n++}return sum/Math.max(1,n)});let total=vals.reduce((a,b)=>a+b,0)+1e-8;return vals.map(v=>Math.sqrt(v/total))}
async function sampleFor(label,duration){$('status').textContent=label;let samples=[],amps=[];let end=performance.now()+duration;while(performance.now()<end){let v=rmsNow();if(v>Math.max(.012,noiseFloor*2.1)){samples.push(feature());amps.push(v)}await sleep(45)}if(samples.length<8)throw Error('收音不足，請靠近手機麥克風持續發聲');let avg=samples[0].map((_,i)=>samples.reduce((a,v)=>a+v[i],0)/samples.length);return {avg,amp:amps.reduce((a,b)=>a+b,0)/amps.length}}
async function calibrate(){if(calibrating)return;calibrating=true;$('panel').style.display='block';$('panel').querySelector('h1').textContent='🎤 聲音校正';$('start').disabled=true;$('calibrate').disabled=true;try{await setupMic();$('status').textContent='先保持安靜 1 秒，測量環境噪音…';await sleep(350);let n=[];for(let i=0;i<16;i++){n.push(rmsNow());await sleep(45)}noiseFloor=n.reduce((a,b)=>a+b,0)/n.length;gate=Math.max(.012,noiseFloor*2.8);$('status').textContent='準備發出「啊」…';await sleep(850);let ah=await sampleFor('現在持續發出「啊——」2 秒',2100);$('status').textContent='放鬆，準備「嗚」…';await sleep(1000);let wu=await sampleFor('現在持續發出「嗚——」2 秒',2100);templates={ah:ah.avg,wu:wu.avg};gate=Math.max(.010,noiseFloor*2.5,Math.min(ah.amp,wu.amp)*.17);voiceVote=0;controlPower=0;$('status').textContent='校正完成！現在可以用「啊」上升、「嗚」下降並減速。';await sleep(650);reset()}catch(e){$('status').textContent='校正失敗：'+e.message+'。可重新校正或使用觸控模式。'}finally{calibrating=false;$('start').disabled=false;$('calibrate').disabled=false}}
async function startMic(){await calibrate()}
$('start').onclick=startMic;$('calibrate').onclick=calibrate;
$('demo').onclick=()=>{mode='touch';reset()};c.addEventListener('pointerdown',e=>{touchDown=e.clientX>W*.5;press=true});addEventListener('pointerup',()=>{press=false;touchDown=false});addEventListener('keydown',e=>{if(e.code==='Space'){press=true;e.preventDefault()}});addEventListener('keyup',e=>{if(e.code==='Space')press=false});function volume(){if(mode==='touch')return press?.85:0;if(!analyser)return 0;let v=rmsNow();return Math.min(1,Math.max(0,(v-gate)/(Math.max(.05,gate*4))))}
function detectVowel(v){if(mode==='touch')return press?(touchDown?'wu':'ah'):'quiet';if(!analyser||calibrating||!templates.ah||rmsNow()<gate)return 'quiet';let f=feature();function dist(t){return f.reduce((a,z,i)=>a+(z-t[i])**2,0)}let da=dist(templates.ah),dw=dist(templates.wu);let delta=(da-dw)/(da+dw+.0001);voiceVote=Math.max(-1,Math.min(1,voiceVote*.77+delta*.65));if(voiceVote>.11)return 'wu';if(voiceVote<-.11)return 'ah';return voiceKind==='quiet'?(dw<da?'wu':'ah'):voiceKind}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}function bg(t){let sky=x.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#4aabc8');sky.addColorStop(.56,'#8cdeea');sky.addColorStop(1,'#e8f1bf');x.fillStyle=sky;x.fillRect(0,0,W,H);let sun=x.createRadialGradient(W*.76,H*.19,2,W*.76,H*.19,W*.46);sun.addColorStop(0,'#fff9db88');sun.addColorStop(1,'#fff9db00');x.fillStyle=sun;x.fillRect(0,0,W,H);for(let layer=0;layer<3;layer++){let shift=(t*(7+layer*8))%100;for(let i=-2;i<W/90+3;i++){let a=i*95-shift;let ht=55+Math.sin(i*2.4+layer)*22;x.fillStyle=['#91c9c7','#65b9af','#3e9e87'][layer];x.globalAlpha=.42+layer*.13;x.fillRect(a,ground-ht,32,ht);x.fillRect(a+34,ground-ht*.7,22,ht*.7);x.fillStyle='#e9f9c9';for(let j=0;j<4;j++)for(let k=0;k<2;k++)x.fillRect(a+5+k*11,ground-ht+9+j*12,4,6)}x.globalAlpha=1}for(let i=0;i<W/50+3;i++){let a=i*55-(t*25)%55;x.fillStyle='#55b875';x.beginPath();x.arc(a,ground-10,31,Math.PI,0);x.fill();x.fillStyle='#7ed68a';x.beginPath();x.arc(a+15,ground-5,21,Math.PI,0);x.fill()}x.fillStyle='#7b9851';x.fillRect(0,ground,W,6);x.fillStyle='#d5b47a';x.fillRect(0,ground+6,W,H-ground);x.fillStyle='#9d7847';for(let i=0;i<W/35+1;i++){x.fillRect(i*35-(t*80)%35,ground+18,19,4)}}function pipe(p){let w=p.w,top=p.gap-p.open/2,bot=p.gap+p.open/2;for(let part of [[0,top-14],[bot,ground-bot]]){let y=p===null?0:part[0],h=part[1];if(h<=0)continue;let g=x.createLinearGradient(p.x,0,p.x+w,0);g.addColorStop(0,'#285b35');g.addColorStop(.12,'#61a34d');g.addColorStop(.32,'#d5ed82');g.addColorStop(.57,'#84c456');g.addColorStop(.85,'#3c853d');g.addColorStop(1,'#214c30');x.fillStyle=g;x.fillRect(p.x,y,w,h);x.strokeStyle='#25492e';x.lineWidth=3;x.strokeRect(p.x,y,w,h);let lipY=y===0?top-24:bot;x.fillStyle=g;rr(p.x-6,lipY,w+12,24,3);x.strokeRect(p.x-6,lipY,w+12,24);x.fillStyle='#ffffff28';x.fillRect(p.x+15,y+4,5,Math.max(0,h-8))}}function chicken(){x.save();x.translate(bird.x,bird.y);x.rotate(bird.rot);let r=bird.r;x.shadowColor='#51261077';x.shadowBlur=10;x.shadowOffsetY=6;let g=x.createRadialGradient(-r*.3,-r*.5,2,0,0,r*1.4);g.addColorStop(0,'#ffe6a1');g.addColorStop(.35,'#eaa24b');g.addColorStop(.7,'#bd6427');g.addColorStop(1,'#753519');x.fillStyle=g;x.beginPath();x.ellipse(0,0,r*1.2,r*.84,-.15,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#9c461c';x.beginPath();x.ellipse(-r*.1,r*.38,r*.48,r*.25,.25,0,7);x.fill();x.fillStyle='#e7a04d';x.beginPath();x.ellipse(r*.25,r*.27,r*.5,r*.25,-.4,0,7);x.fill();x.fillStyle='#ffe0a2';x.beginPath();x.ellipse(-r*.33,-r*.45,r*.55,r*.17,-.35,0,7);x.fill();for(let yy of [-.38,.34]){x.save();x.translate(-r*.98,r*yy);x.rotate(yy);x.fillStyle='#9c4e28';rr(-r*.32,-r*.16,r*.48,r*.32,8);x.fillStyle='#fff0d6';x.beginPath();x.arc(-r*.39,0,r*.15,0,7);x.arc(-r*.54,-r*.09,r*.13,0,7);x.fill();x.restore()}x.fillStyle='white';x.beginPath();x.arc(r*.66,-r*.28,r*.18,0,7);x.fill();x.fillStyle='#27211b';x.beginPath();x.arc(r*.72,-r*.27,r*.085,0,7);x.fill();x.restore()}function update(dt){time+=dt;let raw=volume();smoothed+=(raw-smoothed)*Math.min(1,dt*11);$('vol').textContent=Math.round(smoothed*100)+'%　'+(voiceKind==='wu'?'嗚 ↓ 慢速':voiceKind==='ah'?'啊 ↑':'安靜');$('fill').style.width=Math.round(smoothed*100)+'%';if(state!=='play')return;
let detected=detectVowel(smoothed);voiceKind=detected;const diving=voiceKind==='wu';
$('voiceState').textContent=voiceKind==='wu'?'🟣 嗚：下降／慢速':voiceKind==='ah'?'🟢 啊：上升':'⚪ 安靜：緩降';
// V4: direct velocity control; quick response without acceleration overshoot.
let speed=Math.min(195,+$('forward').value+score*1.3)*scale*(diving?.52:1);
let target=voiceKind==='ah'?-Number($('up').value)*scale:diving?Number($('down').value)*scale:Number($('idle').value)*scale;
// 0.12 s response to vowels, 0.24 s to silence. Clamp overshoot at every frame.
let response=voiceKind==='quiet'?4.2:11;
bird.vy+=(target-bird.vy)*(1-Math.exp(-response*dt));
bird.y+=bird.vy*dt;bird.rot=Math.max(-.48,Math.min(.9,bird.vy/290));
spawn+=dt;if(spawn>2.05){spawn=0;let open=Math.max(175*scale,Math.min(245*scale,H*.34)-score*.65);let margin=80*scale;pipes.push({x:W+30,w:68*scale,gap:margin+open/2+Math.random()*Math.max(1,ground-2*margin-open),open,passed:false})}for(let p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++}let pad=bird.r*.65;if(bird.x+pad>p.x-6&&bird.x-pad<p.x+p.w+6&&(bird.y-pad<p.gap-p.open/2||bird.y+pad>p.gap+p.open/2))end()}pipes=pipes.filter(p=>p.x+p.w>-20);if(bird.y+bird.r*.7>ground||bird.y-bird.r<0)end();$('score').textContent=`${score}　🏆 ${best}`}function draw(){bg(time);for(let p of pipes)pipe(p);if(bird)chicken();if(flash>0){x.fillStyle=`rgba(255,90,60,${flash*.22})`;x.fillRect(0,0,W,H);flash*=.86}}function loop(ts){let dt=Math.min(.035,(ts-last)/1000||.016);last=ts;update(dt);draw();requestAnimationFrame(loop)}bird={x:W*.28,y:H*.43,vy:0,r:21*scale,rot:0};requestAnimationFrame(loop);
</script></body></html>
